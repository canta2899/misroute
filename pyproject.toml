[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset", "src/simulate", "src/analysis"]

[project]
name = "misroute"
version = "0.1.0"
description = "Synthetic dataset and hidden-state probing for coordinator routing"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=2.21",
    "joblib>=1.5.3",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.7.2",
    # 1.15 is where tukey_hsd got equal_var, i.e. Games-Howell
    "scipy>=1.15",
    "torch>=2.12.0",
    "tqdm>=4.68.3",
    "transformers>=5.14.1",
    "huggingface-hub>=0.36.2",
    "modal>=1.5.1",
    "pytest>=9.1.1",
    "anthropic>=0.60",
    "openai>=1.60",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0",
    "statsmodels>=0.14.6",
    "seaborn>=0.13.2",
    "marimo>=0.23.16",
    "shap>=0.48",
    "tiktoken>=0.13.0",
]

[project.scripts]
ds = "dataset.cli:main"
merge-shards = "simulate.merge_shards:main"

# Runtime deps for the LLM simulation, installed on the Modal image via
# `uv sync --group simulation` (see src/simulate/modal_image.py).
[dependency-groups]
simulation = [
    "torch>=2.12.0",
    "transformers>=5.14.1",
    "accelerate>=1.14.0",
    # hub kernels: mxfp4 experts for gpt-oss
    "kernels>=0.12.0",
    "huggingface-hub>=0.36.2",
    "numpy",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "tqdm>=4.68.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
